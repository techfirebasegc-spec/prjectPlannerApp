<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcflow — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-label="Login form">
      <p class="login-kicker">Secure Access</p>
      <h1>Arcflow</h1>
      <p class="login-subtitle">Sign in with your verified Firebase account.</p>
      <form id="loginForm" novalidate>
        <label for="userId">Email address</label>
        <input id="userId" name="userId" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        <button id="loginBtn" type="submit">Sign In</button>
        <button id="createAccountBtn" class="secondary-btn" type="button">Create Email Account</button>
        <button id="googleSignInBtn" class="google-btn" type="button">Continue with Google</button>
        <button id="resendVerificationBtn" class="link-btn is-hidden" type="button">Resend verification email</button>
        <p id="loginError" class="login-error" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
