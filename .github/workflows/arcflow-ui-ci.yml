name: Arcflow UI CI

on:
  push:
    branches:
      - feature/arctflow-ui-stories
  pull_request:
    branches:
      - feature/arctflow-ui-stories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check auth.js
          node --check firebase.js
      - name: Build production bundle
        run: npm run build
